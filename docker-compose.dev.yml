# =============================================================
# Development Docker Compose: Local PostgreSQL Alone
# Usage: docker compose -f docker-compose.dev.yml up -d
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: problempulse_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: problempulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d problempulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
